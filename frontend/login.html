<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGuard | Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-mark">W</span>WebGuard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <ul class="navbar-nav" id="navAuth">
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container page-shell">
        <div class="login-shell">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="login-card">
                        <div class="card-header text-center">
                            <h4 class="mb-1">Portal Sign In</h4>
                            <small class="text-white-50">Secure access for storefront + admin</small>
                        </div>
                        <div class="card-body">
                            <div id="errorMsg" class="alert alert-danger py-2" style="display:none;"></div>
                            <div id="successMsg" class="alert alert-success py-2" style="display:none;"></div>

                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username or Email</label>
                                    <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="e.g. user@try or admin" required autocomplete="username">
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                                </div>
                                <button type="submit" id="loginBtn" class="btn btn-primary btn-lg w-100 mb-3">Sign In</button>
                            </form>

                            <div class="mt-4 pt-3 border-top border-light-subtle">
                                <h6 class="text-uppercase small text-muted mb-2">Quick Demo Credentials</h6>
                                <div class="demo-credentials">
                                    <button type="button" class="demo-chip" onclick="fillCredentials('user@try', 'user123')">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span>👤 <strong>User:</strong> user@try</span>
                                            <span class="badge bg-secondary">Fill</span>
                                        </div>
                                        <div class="small text-muted">Password: <code>user123</code> → Storefront</div>
                                    </button>
                                    <button type="button" class="demo-chip" onclick="fillCredentials('admin', 'admin123')">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span>🛡️ <strong>Admin:</strong> admin</span>
                                            <span class="badge bg-warning text-dark">Fill</span>
                                        </div>
                                        <div class="small text-muted">Password: <code>admin123</code> → SecOps Dashboard</div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        trackRequest('/api/login');

        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('errorMsg').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerText = 'Authenticating...';

            try {
                let response;
                let fetchError = null;

                try {
                    response = await fetch(`${BACKEND_URL}/api/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                } catch (primaryErr) {
                    fetchError = primaryErr;
                    if (typeof FALLBACK_BACKEND_URL !== 'undefined' && FALLBACK_BACKEND_URL && BACKEND_URL !== FALLBACK_BACKEND_URL) {
                        try {
                            loginBtn.innerText = 'Connecting to fallback server...';
                            response = await fetch(`${FALLBACK_BACKEND_URL}/api/login`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ username, password })
                            });
                            BACKEND_URL = FALLBACK_BACKEND_URL;
                            fetchError = null;
                        } catch (fallbackErr) {
                            fetchError = fallbackErr;
                        }
                    }
                }

                if (fetchError || !response) {
                    throw fetchError || new Error("Failed to reach server");
                }

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    setCurrentUser({
                        username: data.username,
                        role: data.role
                    });

                    successMsg.innerHTML = `<strong>${data.message}</strong>`;
                    successMsg.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 900);
                } else {
                    errorMsg.innerText = data.message || 'Invalid username or password.';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Sign In';
                }
            } catch (err) {
                console.error("Login request failed:", err);
                errorMsg.innerHTML = '<strong>Connection error:</strong> Unable to reach the backend server.<br><small class="text-muted">Ensure local Flask is running (<code>python run.py</code>) or that you have an internet connection to the cloud backend.</small>';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerText = 'Sign In';
            }
        });
    </script>
</body>
</html>
