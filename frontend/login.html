<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-card {
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        .demo-chip {
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .demo-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">TechStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card bg-white">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <h4 class="mb-1">Portal Sign In</h4>
                        <small class="text-white-50">Unified login for Store Users and SecOps Admins</small>
                    </div>
                    <div class="card-body p-4">
                        <div id="errorMsg" class="alert alert-danger py-2" style="display:none;"></div>
                        <div id="successMsg" class="alert alert-success py-2" style="display:none;"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username or Email</label>
                                <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="e.g. user@try or admin" required autocomplete="username">
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            </div>
                            <button type="submit" id="loginBtn" class="btn btn-primary btn-lg w-100 mb-3">Sign In</button>
                        </form>

                        <div class="mt-4 pt-3 border-top">
                            <h6 class="text-muted small text-uppercase mb-2 fw-bold">Quick Demo Credentials:</h6>
                            <div class="d-flex flex-column gap-2">
                                <button type="button" class="btn btn-outline-secondary btn-sm text-start demo-chip" onclick="fillCredentials('user@try', 'user123')">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>👤 <strong>User:</strong> user@try</span>
                                        <span class="badge bg-secondary">Fill</span>
                                    </div>
                                    <div class="small text-muted">Password: <code>user123</code> &rarr; Storefront</div>
                                </button>
                                <button type="button" class="btn btn-outline-warning btn-sm text-start demo-chip text-dark" onclick="fillCredentials('admin', 'admin123')">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>🛡️ <strong>Admin:</strong> admin</span>
                                        <span class="badge bg-warning text-dark">Fill</span>
                                    </div>
                                    <div class="small text-muted">Password: <code>admin123</code> &rarr; SecOps Dashboard</div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Track the page view
        trackRequest('/api/login');

        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
            document.getElementById('errorMsg').style.display = 'none';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Reset alerts
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerText = 'Authenticating...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    // Save user credentials/role in localStorage
                    setCurrentUser({
                        username: data.username,
                        role: data.role
                    });

                    successMsg.innerHTML = `<strong>${data.message}</strong>`;
                    successMsg.style.display = 'block';

                    // Redirect to designated dashboard or storefront
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 900);
                } else {
                    errorMsg.innerText = data.message || 'Invalid username or password.';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Sign In';
                }
            } catch (err) {
                console.error("Login request failed:", err);
                errorMsg.innerText = 'Connection error: Unable to reach the server. Is the backend running?';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerText = 'Sign In';
            }
        });
    </script>
</body>
</html>
