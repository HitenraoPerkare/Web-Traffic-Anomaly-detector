<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGuard | Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-mark">W</span>WebGuard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <ul class="navbar-nav" id="navAuth">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container page-shell">
        <div class="section-heading">
            <h2>Our Products</h2>
            <span class="badge bg-light text-dark px-3 py-2">Curated for secure shopping</span>
        </div>

        <div class="filter-pills" aria-label="Product categories">
            <a href="products.html" class="btn btn-sm active">All</a>
            <a href="products.html?category=electronics" class="btn btn-sm">Electronics</a>
            <a href="products.html?category=home" class="btn btn-sm">Home</a>
            <a href="products.html?category=furniture" class="btn btn-sm">Furniture</a>
        </div>

        <div class="row g-4" id="product-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        trackRequest('/api/products' + window.location.search);

        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category');

        const allProducts = [
            { id: 1, name: 'Wireless Laptop', price: 999.99, category: 'electronics', description: 'Premium ultraportable workstation for modern teams.' },
            { id: 2, name: 'Bluetooth Headphones', price: 149.50, category: 'electronics', description: 'Immersive sound with all-day comfort.' },
            { id: 3, name: 'Coffee Maker', price: 75.00, category: 'home', description: 'Brew the perfect cup with smart automation.' },
            { id: 4, name: 'Office Chair', price: 250.00, category: 'furniture', description: 'Ergonomic support designed for long workdays.' }
        ];

        const products = category ? allProducts.filter(p => p.category === category) : allProducts;
        const container = document.getElementById('product-list');

        if (products.length > 0) {
            container.innerHTML = products.map(p => `
                <div class="col-md-6 col-xl-4">
                    <div class="product-card">
                        <span class="tag">${p.category}</span>
                        <h5>${p.name}</h5>
                        <div class="price">$${p.price.toFixed(2)}</div>
                        <p class="meta">${p.description}</p>
                        <button class="btn btn-primary" onclick="trackRequest('/api/cart/add', 'POST', {id: ${p.id}})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = `<div class="col-12"><div class="alert alert-info">No products found for this category.</div></div>`;
        }
    </script>
</body>
</html>
