<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">TechStore</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Search Products</h2>
        <div class="card p-4 mb-4">
            <!-- Intercepted by JS to send backend request -->
            <form id="searchForm">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="q" name="q" placeholder="Enter search term...">
                    <button class="btn btn-primary" type="submit">Search</button>
                </div>
            </form>
            <small class="text-muted">Hint: This is a prime spot to test SQL Injection or XSS payloads.</small>
        </div>

        <div id="searchResults" style="display: none;">
            <div class="alert alert-secondary">
                Showing results for: <strong id="queryText"></strong>
                <p class="mt-2 text-muted">No results found.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const q = document.getElementById('q').value;
            document.getElementById('queryText').innerText = q;
            document.getElementById('searchResults').style.display = 'block';
            
            // Track request to backend for anomaly engine
            trackRequest('/api/search?q=' + encodeURIComponent(q));
        });
    </script>
</body>
</html>
