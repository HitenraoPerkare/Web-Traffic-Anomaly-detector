<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGuard | Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><span class="brand-mark">W</span>WebGuard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link active" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
                <ul class="navbar-nav" id="navAuth">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container page-shell">
        <div class="search-panel">
            <div class="section-heading">
                <h2>Search Products</h2>
                <span class="badge bg-light text-dark px-3 py-2">Live catalog lookup</span>
            </div>

            <form id="searchForm">
                <div class="search-input-group">
                    <input type="text" class="form-control form-control-lg" id="q" name="q" placeholder="Search products, categories, or terms...">
                    <button class="btn btn-primary btn-lg" type="submit">Search</button>
                </div>
            </form>

            <div id="searchResults" style="display: none;">
                <div class="search-result">
                    Showing results for: <strong id="queryText"></strong>
                    <p class="mt-3 mb-0 text-muted">No results found.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const q = document.getElementById('q').value;
            document.getElementById('queryText').innerText = q;
            document.getElementById('searchResults').style.display = 'block';
            trackRequest('/api/search?q=' + encodeURIComponent(q));
        });
    </script>
</body>
</html>
